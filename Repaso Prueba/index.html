<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>Available Developers</header>
    <div id="amarillo">
        <div class="Text">
            <label>Nombre:</label>
            <input type="text" id="Nombre" placeholder="Developer Name">
            <label>URL Avatar</label>
            <input type="text" id="Avatar" placeholder="Avatar">
        </div>
        <div class="Presentate">
            <label> Preséntate</label>
            <textarea id="Presentacion" placeholder="Biography" rows="2" cols="30"></textarea>
        </div>
        <div class="Lenguaje">
            <label>Lenguajes:</label>
            <input type="checkbox" name="html" id="html"><label for="html">HTML<label></label>
            <input type="checkbox" name="js" id="js"><label for="js">JS<label></label>
            <input type="checkbox" name="css" id="css"> <label for="css">CSS<label></label>
            <input type="checkbox" name="node" id="node"><label for="node">Node<label></label>
            <input type="checkbox" name="mongo" id="mongo"><label for="mongo">MongoDB<label></label>
                              
        </div>
    </div>

</body>

</html>
